let activeUser=null, pending=false, writing=false, revision=null, conflict=false;
const blank=()=>({nick:'',oshis:[],events:[]});const blankNews=()=>({items:[],last:0,signature:''});
const legacy={db:structuredClone(db),news:structuredClone(news)};
function status(t){$('syncStatus').textContent=t}
function queueSave(){if(!activeUser)return;pending=true;status('未同期の変更があります');flush()}
async function flush(){if(writing||!activeUser||conflict)return;writing=true;try{while(pending){pending=false;const payload={db:structuredClone(db),news:structuredClone(news)};const stamp=new Date().toISOString();let q=revision===null?client.from('oshikare_data').insert({user_id:activeUser.id,data:payload,updated_at:stamp}):client.from('oshikare_data').update({data:payload,updated_at:stamp}).eq('user_id',activeUser.id).eq('updated_at',revision);const {data,error}=await q.select('updated_at');if(error||!data?.length){pending=true;if(error?.code==='23505'||(!error&&!data?.length)){conflict=true;status('別端末で更新されました。同期ボタンから選択してください。')}else status('保存失敗：同期ボタンで再試行してください');break}revision=data[0].updated_at;status('クラウド保存済み')}}catch(e){pending=true;status('通信エラー：同期を再試行してください')}finally{writing=false}}
async function load(user){const {data,error}=await client.from('oshikare_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;revision=data?.updated_at??null;db=data?.data?.db??blank();news=data?.data?.news??blankNews();if(!data&&(legacy.db.oshis.length||legacy.db.events.length)&&confirm('このブラウザの旧データをこのアカウントに取り込みますか？')){db=structuredClone(legacy.db);news=structuredClone(legacy.news);pending=true}activeUser=user;conflict=false;$('account').textContent=user.email;$('authPanel').hidden=true;$('app').hidden=false;render();renderNews();status('同期済み');if(pending)await flush();collectNews(false)}
async function syncNow(){if(writing||busy)return;if(conflict){if(!confirm('別端末のデータを読み込みますか？ この端末の未保存変更は失われます。キャンセルすると保持されます。'))return;pending=false;conflict=false}if(pending){await flush();return}try{await load(activeUser)}catch(e){status('読み込み失敗：'+e.message)}}
async function logout(){if(busy||writing){alert('処理完了後にログアウトしてください');return}if(pending){await flush();if(pending){alert('未保存の変更があります。同期してください');return}}const {error}=await client.auth.signOut();if(error){status(error.message);return}location.reload()}
$('authForm').onsubmit=async e=>{e.preventDefault();if(!client)return;const buttons=[...e.target.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const credentials={email:$('email').value.trim(),password:$('password').value};const {data,error}=await (e.submitter.id==='signup'?client.auth.signUp(credentials):client.auth.signInWithPassword(credentials));if(error)throw error;if(!data.session)throw Error('確認メール設定を確認してください');await load(data.user);$('password').value=''}catch(e){$('authStatus').textContent=e.message}finally{buttons.forEach(b=>b.disabled=false)}};
window.addEventListener('beforeunload',e=>{if(pending||writing){e.preventDefault();e.returnValue=''}});window.addEventListener('focus',()=>{if(activeUser&&!pending&&!writing&&!busy&&!$('dlg').open)syncNow()});
(async()=>{try{if(!client)throw Error('認証ライブラリを読み込めません');const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)await load(data.session.user)}catch(e){$('authStatus').textContent=e.message}})();
</script></html>
